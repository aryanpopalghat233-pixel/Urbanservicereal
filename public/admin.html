<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URBANSERVICE Admin Panel</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: black;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

h2 {
  margin-top: 30px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 10px;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
}

th {
  background: #222;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>URBANSERVICE ADMIN PANEL</h1>
</header>

<div class="container">

  <h2>Bookings</h2>
  <table id="bookingTable">
    <tr>
      <th>Name</th>
      <th>Service</th>
      <th>Address</th>
    </tr>
  </table>

  <h2>Workers</h2>
  <table id="workerTable">
    <tr>
      <th>Name</th>
      <th>Service</th>
      <th>Latitude</th>
      <th>Longitude</th>
    </tr>
  </table>

</div>

<script>

// FETCH BOOKINGS
fetch('/api/bookings')
.then(res => res.json())
.then(data => {
  let table = document.getElementById('bookingTable');

  data.forEach(b => {
    let row = table.insertRow();
    row.insertCell(0).innerText = b.name;
    row.insertCell(1).innerText = b.service;
    row.insertCell(2).innerText = b.address;
  });
});

// FETCH WORKERS
fetch('/api/workers')
.then(res => res.json())
.then(data => {
  let table = document.getElementById('workerTable');

  data.forEach(w => {
    let row = table.insertRow();
    row.insertCell(0).innerText = w.name;
    row.insertCell(1).innerText = w.service;
    row.insertCell(2).innerText = w.lat;
    row.insertCell(3).innerText = w.lng;
  });
});

</script>

</body>
</html>
