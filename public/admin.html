<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URBANSERVICE Admin Panel</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }

header {
  background:black;
  color:white;
  padding:15px;
  text-align:center;
}

.container { padding:20px; }

input {
  padding:10px;
  margin:5px;
  width:200px;
}

button {
  padding:8px 12px;
  margin:3px;
  cursor:pointer;
  border:none;
  background:#222;
  color:white;
}

button:hover {
  background:#444;
}

table {
  width:100%;
  border-collapse: collapse;
  background:white;
  margin-top:10px;
}

th, td {
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th { background:#222; color:white; }

#map {
  height:400px;
  margin-top:20px;
  border-radius:10px;
}

.login-box {
  text-align:center;
  margin-top:120px;
}

.login-box h2 {
  margin-bottom:20px;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN PAGE -->
<div id="loginPage" class="login-box">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- ✅ ADMIN PANEL -->
<div id="adminPanel" style="display:none">

<header>
  <h1>URBANSERVICE ADMIN PANEL</h1>
</header>

<div class="container">

<h2>📋 Bookings</h2>
<table id="bookingTable">
<tr>
<th>Name</th>
<th>Service</th>
<th>Address</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

<h2>📍 Workers Live Map</h2>
<div id="map"></div>

</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 🔐 LOGIN SYSTEM (FRONTEND ONLY)
function login(){
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;

  if(user === "admin" && pass === "1234"){
    document.getElementById('loginPage').style.display = "none";
    document.getElementById('adminPanel').style.display = "block";

    loadBookings();
    loadMap();
  } else {
    alert("Invalid username or password");
  }
}

// 🧾 LOAD BOOKINGS + APPROVAL SYSTEM
function loadBookings(){
  fetch('/api/bookings')
  .then(res => res.json())
  .then(data => {

    let table = document.getElementById('bookingTable');

    data.forEach((b, index) => {

      let savedStatus = localStorage.getItem("booking_"+index);
      let status = savedStatus ? savedStatus : "Pending";

      let row = table.insertRow();

      // 🎨 Row color based on status
      if(status === "Approved") row.style.background = "#d4edda";
      if(status === "Rejected") row.style.background = "#f8d7da";
      if(status === "Pending") row.style.background = "#fff3cd";

      row.insertCell(0).innerText = b.name;
      row.insertCell(1).innerText = b.service;
      row.insertCell(2).innerText = b.address;

      let statusCell = row.insertCell(3);
      statusCell.innerText = status;

      let actionCell = row.insertCell(4);

      let approveBtn = document.createElement("button");
      approveBtn.innerText = "Approve";

      let rejectBtn = document.createElement("button");
      rejectBtn.innerText = "Reject";

      // 🚫 Disable buttons if already decided
      if(status !== "Pending"){
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
      }

      approveBtn.onclick = () => {
        localStorage.setItem("booking_"+index, "Approved");
        location.reload();
      };

      rejectBtn.onclick = () => {
        localStorage.setItem("booking_"+index, "Rejected");
        location.reload();
      };

      actionCell.appendChild(approveBtn);
      actionCell.appendChild(rejectBtn);
    });

  });
}

// 📍 LOAD WORKERS MAP
function loadMap(){

  let map = L.map('map').setView([18.5204, 73.8567], 12); // Pune default

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  fetch('/api/workers')
  .then(res => res.json())
  .then(data => {

    data.forEach(w => {
      if(w.lat && w.lng){
        L.marker([w.lat, w.lng])
          .addTo(map)
          .bindPopup(`<b>${w.name}</b><br>${w.service}`);
      }
    });
fetch(`/api/bookings/approve/${id}`, { method: "PUT" })
fetch(`/api/bookings/reject/${id}`, { method: "PUT" })    
  });
}

</script>

</body>
</html>
