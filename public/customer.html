<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Panel - URBANSERVICE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: black;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}

#map {
  height: 400px;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Customer Dashboard</h1>
</header>

<div class="container">

<div class="card">
  <h2>Your Bookings</h2>
  <div id="bookingList"></div>
</div>

<div class="card">
  <h2>Worker Tracking Map</h2>
  <div id="map"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let workers = [];

// 📍 LOAD WORKERS
fetch('/api/workers')
.then(res => res.json())
.then(data => {
  workers = data;
});

// 🧾 LOAD BOOKINGS
fetch('/api/bookings')
.then(res => res.json())
.then(bookings => {

  let container = document.getElementById("bookingList");

  bookings.forEach((b, index) => {

    let status = localStorage.getItem("booking_"+index) || "Pending";

    // 🤖 RANDOM WORKER ASSIGNMENT
    let assignedWorker = null;

    if(status === "Approved" && workers.length > 0){
      assignedWorker = workers[Math.floor(Math.random() * workers.length)];
    }

    // 📦 CARD UI
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>Service:</b> ${b.service} <br>
      <b>Status:</b> ${status} <br>
      <b>Worker:</b> ${assignedWorker ? assignedWorker.name : "Not Assigned"} <br>
      <b>ETA:</b> ${assignedWorker ? "15-30 min (approx)" : "N/A"}
    `;

    container.appendChild(div);

  });

});

// 🗺️ MAP
let map = L.map('map').setView([18.5204, 73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// SHOW WORKERS ON MAP
fetch('/api/workers')
.then(res => res.json())
.then(data => {

  data.forEach(w => {
    if(w.lat && w.lng){
      L.marker([w.lat, w.lng])
        .addTo(map)
        .bindPopup(`${w.name} - ${w.service}`);
    }
  });

});

</script>

</body>
</html>
